<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f0f14">
    <title>Viewlix</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #0f0f14 0%, #1a1a24 50%, #0a0a0e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        
        .splash-container {
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }
        
        .logo-container {
            position: relative;
            margin-bottom: 24px;
        }
        
        .logo {
            width: 120px;
            height: 120px;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .logo-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, rgba(229, 9, 20, 0.3) 0%, transparent 70%);
            animation: glow 2s ease-in-out infinite;
            z-index: -1;
        }
        
        .brand-name {
            font-size: 48px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }
        
        .brand-name span {
            color: #e50914;
        }
        
        .tagline {
            font-size: 14px;
            color: #8b8b9a;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .loader {
            margin-top: 48px;
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        
        .loader-dot {
            width: 10px;
            height: 10px;
            background-color: #e50914;
            border-radius: 50%;
            animation: bounce 1.4s ease-in-out infinite both;
        }
        
        .loader-dot:nth-child(1) { animation-delay: -0.32s; }
        .loader-dot:nth-child(2) { animation-delay: -0.16s; }
        .loader-dot:nth-child(3) { animation-delay: 0s; }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }
        
        @keyframes glow {
            0%, 100% {
                opacity: 0.5;
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2);
            }
        }
        
        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }
        
        .version {
            position: fixed;
            bottom: 24px;
            color: #4a4a5a;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="splash-container">
        <div class="logo-container">
            <div class="logo-glow"></div>
            <svg class="logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="100" height="100" rx="20" fill="#1a1a24"/>
                <path d="M25 25H40L50 55L60 25H75L50 80L25 25Z" fill="#e50914"/>
                <path d="M25 25H40L50 55L60 25H75" stroke="#ff1a25" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </div>
        <h1 class="brand-name">VIEW<span>LIX</span></h1>
        <p class="tagline">Movies • TV Shows • Anime</p>
        <div class="loader">
            <div class="loader-dot"></div>
            <div class="loader-dot"></div>
            <div class="loader-dot"></div>
        </div>
    </div>
    <p class="version">v2.0.0</p>
</body>
</html>
