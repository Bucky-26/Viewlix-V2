<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="theme-color" content="#0d0d0d">
    <title>Offline - Viewlix</title>
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link href="https://fonts.bunny.net/css?family=instrument-sans:400,500,600,700" rel="stylesheet" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Instrument Sans', sans-serif;
            background: linear-gradient(135deg, #0d0d0d, #080808);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* Background particles */
        .particle {
            position: absolute;
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: rgba(229, 9, 20, 0.3);
            animation: float 15s linear infinite;
        }
        @keyframes float {
            0% { transform: translateY(100vh); opacity:0; }
            50% { opacity:0.8; }
            100% { transform: translateY(-10vh); opacity:0; }
        }

        .container {
            text-align: center;
            z-index: 1;
            max-width: 600px;
            position: relative;
        }

        .logo-container {
            position: relative;
            margin-bottom: 30px;
        }
        .logo {
            width: 100px;
            height: 100px;
            animation: floatLogo 3s ease-in-out infinite;
        }
        @keyframes floatLogo {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .brand-name {
            font-size: 36px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .brand-name span { color: #e50914; }

        .title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #fff;
        }
        .subtitle {
            font-size: 16px;
            color: #9ca3af;
            margin-bottom: 40px;
        }

        /* Device to server animation */
        .connection-box {
            position: relative;
            width: 300px;
            height: 80px;
            margin: 0 auto 30px;
        }

        .device, .server {
            position: absolute;
            border-radius: 8px;
        }
        .device {
            width: 60px; height: 40px;
            background: rgba(229,9,20,0.2);
            border: 2px solid #e50914;
            left:0;
            top:50%;
            transform: translateY(-50%);
        }
        .server {
            width: 50px; height: 60px;
            background: rgba(229,9,20,0.15);
            border: 2px solid #e50914;
            right:0;
            top:50%;
            transform: translateY(-50%);
        }

        .packet {
            width: 12px; height: 12px;
            background: #e50914;
            border-radius: 50%;
            position: absolute;
            left: 60px;
            top: 50%;
            transform: translateY(-50%);
            animation: movePacket 2s infinite;
            box-shadow: 0 0 10px rgba(229,9,20,0.7);
        }
        @keyframes movePacket {
            0% { left: 60px; opacity:0; }
            20% { opacity:1; }
            80% { opacity:1; }
            100% { left: 230px; opacity:0; }
        }

        .retry-button {
            padding: 12px 30px;
            background: #e50914;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .retry-button:hover { background: #b20710; transform: translateY(-2px); }
        .retry-button:active { transform: translateY(0); }

        .status-message {
            font-size: 14px;
            color: #6b7280;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <!-- Particles -->
    <div id="particles"></div>

    <div class="container">
        <div class="logo-container">
            <svg class="logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="100" height="100" rx="20" fill="#1a1a1a"/>
                <path d="M25 25H40L50 55L60 25H75L50 80L25 25Z" fill="#e50914"/>
            </svg>
        </div>

        <h1 class="brand-name">VIEW<span>LIX</span></h1>
        <h2 class="title">No Internet Connection</h2>
        <p class="subtitle">Please check your internet connection and try again.</p>

        <div class="connection-box">
            <div class="device"></div>
            <div class="server"></div>
            <div class="packet"></div>
        </div>

        <p class="status-message">Attempting to reconnect...</p>
        <button class="retry-button" onclick="window.location.reload()">Retry Connection</button>
    </div>

    <script>
        // Particles generation
        const particlesContainer = document.getElementById('particles');
        for(let i=0;i<30;i++){
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random()*100+'%';
            p.style.top = Math.random()*100+'%';
            p.style.width = p.style.height = Math.random()*3+2+'px';
            p.style.animationDuration = 10 + Math.random()*10 + 's';
            particlesContainer.appendChild(p);
        }

        // Auto-retry connection
        let retryCount = 0, maxRetries=10;
        function checkConnection() {
            if(navigator.onLine) window.location.reload();
            else {
                retryCount++;
                if(retryCount<maxRetries) setTimeout(checkConnection,5000);
            }
        }
        setTimeout(checkConnection,5000);
        window.addEventListener('online',()=>window.location.reload());
    </script>
</body>
</html>
